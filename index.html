<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;touch-action:none}
#c{width:100%;height:100%;display:block;outline:none;touch-action:none}
#loading{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:#000;transition:opacity .24s ease;pointer-events:none}
#loading.off{opacity:0}
#pulse{width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 0 28px 8px rgba(255,255,255,.7);animation:p 1.05s ease-in-out infinite}
@keyframes p{0%,100%{transform:scale(.5);opacity:.3}50%{transform:scale(1.25);opacity:1}}
#label{white-space:pre-line;position:fixed;z-index:8;left:16px;top:max(14px,env(safe-area-inset-top));font-size:12px;letter-spacing:.13em;text-transform:uppercase;text-shadow:0 1px 7px #000;display:none;pointer-events:none}
#modeBtns{position:fixed;z-index:14;right:12px;top:max(10px,env(safe-area-inset-top));display:flex;gap:7px}
.modeBtn{width:44px;height:38px;border:1px solid rgba(255,255,255,.35);border-radius:18px;background:rgba(0,0,0,.28);color:#fff;font:700 16px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.modeBtn.on{background:rgba(255,255,255,.9);color:#000}
#langBtn{font-size:10px;letter-spacing:.04em}
#controls{position:fixed;inset:0;z-index:10;pointer-events:none}
#joystick{display:none;pointer-events:auto;position:absolute;left:18px;bottom:calc(20px + env(safe-area-inset-bottom));width:118px;height:118px;border-radius:50%;border:1px solid rgba(255,255,255,.28);background:rgba(0,0,0,.22);box-shadow:inset 0 0 24px rgba(255,255,255,.05);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);touch-action:none}
#joystick:after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:rgba(255,255,255,.28)}
#joystickKnob{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px;border-radius:50%;border:1px solid rgba(255,255,255,.7);background:rgba(255,255,255,.16);box-shadow:0 0 18px rgba(255,255,255,.10);transform:translate(0px,0px);will-change:transform}
@media (pointer:coarse),(max-width:900px){#joystick{display:block}}
#search{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.78);padding:22px}
#search form{width:min(430px,100%);display:flex;gap:8px}
#search input{flex:1;min-width:0;background:#050505;border:1px solid #555;color:#fff;padding:14px;font:inherit;font-size:16px;border-radius:3px}
#search button{border:0;background:#fff;color:#000;padding:0 15px;border-radius:3px;font:inherit;font-weight:800}
#search .x{background:#222;color:#fff;border:1px solid #555}

<div id="search"><form id="searchForm"><input id="searchInput" autocomplete="off" autocapitalize="words" placeholder="…"><button type="submit">→</button><button type="button" class="x" id="searchClose">×</button></form></div>
<script>
/* WIKIDREAMER 1.0.1 — GitHub Pages release build */
(() => {
'use strict';
const APP_NAME='WIKIDREAMER';
const APP_VERSION='1.0.1';
const WD='https://www.wikidata.org/w/api.php';
const CM='https://commons.wikimedia.org/w/api.php';
const MOBILE=/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
const $=id=>document.getElementById(id);
const canvas=$('c'), loading=$('loading'), labelEl=$('label'), searchEl=$('search'), searchInput=$('searchInput');
const keys={f:false,b:false,l:false,r:false};
const joystick={x:0,y:0,active:false,pid:null};
let engine,scene,camera,envRoot,entityRoot,skyMesh,searchOrb;
let currentEntity=null,currentWorld=null,transitioning=false,silentMode=false;
const TTS_LANGS=[['it-IT','IT'],['en-US','EN']];
let ttsLangIndex=0;
let streamToken=0,voiceTimer=null,searchCooldown=0;
let colliders=[],entities=[],animators=[],spawnSlots=[];
let linkPool=[],linkPoolIds=new Set(),entityPopulateBusy=false;
let groundHeight=(x,z)=>0;
let audioCtx=null,audioMaster=null,audioNodes=[];
const entityCache=new Map(), imageCache=new Map();
const assetContainers=new Map();
const ASSET_INDEX_URL='https://raw.githubusercontent.com/BabylonJS/Assets/master/structure.json';
const ASSET_CDN_ROOT='https://assets.babylonjs.com/';
let BABYLON_ENTITY_ASSETS=[];
let assetIndexReady=false;
let assetIndexPromise=null;
const badAssetKeys=new Set();
let infiniteChunks=new Map(), lastChunkKey='', worldFamily='natural', worldMats=null;
const CHUNK_SIZE=260, CHUNK_RADIUS=1;

const WLOG=(event,data={})=>console.log('[WIKIDREAMER]',event,data);
const now=()=>performance.now();
const rnd=(max=1,min=0)=>min+Math.random()*(max-min);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function showLoading(on){loading.classList.toggle('off',!on)}
function currentTtsLang(){return TTS_LANGS[ttsLangIndex][0]}
function currentLangKey(){return currentTtsLang().toLowerCase().startsWith('en')?'en':'it'}
function entityLabel(ent=currentEntity){if(!ent)return'';const k=currentLangKey();return ent.labels?.[k]||ent.label||''}
function entityDescription(ent=currentEntity){if(!ent)return'';const k=currentLangKey();return ent.descriptions?.[k]||ent.description||''}
function updateLabel(){ const hasTTS='speechSynthesis' in window; const show=(silentMode||!hasTTS)&&currentEntity; labelEl.style.display=show?'block':'none'; if(!show){labelEl.textContent='';return;} const name=entityLabel(); const desc=entityDescription().replace(/\s+/g,' ').trim(); labelEl.textContent=desc ? name+'\n'+desc : name; }
function setSilent(v){ silentMode=v; if(v && 'speechSynthesis' in window) speechSynthesis.cancel(); else if(!v&&currentEntity) speakLoop(entityLabel()); updateLabel(); const b=$('muteBtn'); if(b){b.classList.toggle('on',v);b.textContent=v?'🔇':'🔊';b.setAttribute('aria-pressed',String(v));b.setAttribute('aria-label',v?'Audio disattivato':'Audio acceso');b.title=v?'Audio disattivato':'Audio acceso';} WLOG('silent-mode',{silent:v}); }
function cycleLanguage(){ttsLangIndex=(ttsLangIndex+1)%TTS_LANGS.length;$('langBtn').textContent=TTS_LANGS[ttsLangIndex][1];updateLabel();if(!silentMode&&currentEntity){if('speechSynthesis'in window)speechSynthesis.cancel();speakLoop(entityLabel())}WLOG('tts-language',{lang:currentTtsLang()})}

// ---------- network ----------
async function loadScript(src,timeout=6500){return new Promise((resolve,reject)=>{const s=document.createElement('script');const t=setTimeout(()=>{s.remove();reject(new Error('timeout'))},timeout);s.src=src;s.async=true;s.onload=()=>{clearTimeout(t);resolve()};s.onerror=()=>{clearTimeout(t);s.remove();reject(new Error('cdn'))};document.head.appendChild(s)})}
async function ensureBabylon(){
  if(!window.BABYLON){
    for(const src of ['https://cdn.babylonjs.com/babylon.js','https://cdn.jsdelivr.net/npm/babylonjs@8.31.3/babylon.js','https://unpkg.com/babylonjs@8.31.3/babylon.js']){
      try{await loadScript(src);if(window.BABYLON)break}catch(e){}
    }
  }
  if(!window.BABYLON)throw new Error('Babylon.js unavailable');
  if(!window.BABYLON.GLTFFileLoader){
    for(const src of ['https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js','https://cdn.jsdelivr.net/npm/babylonjs-loaders@8.31.3/babylonjs.loaders.min.js','https://unpkg.com/babylonjs-loaders@8.31.3/babylonjs.loaders.min.js']){
      try{await loadScript(src);if(window.BABYLON.GLTFFileLoader)break}catch(e){}
    }
  }
  if(!window.BABYLON.GLTFFileLoader)WLOG('asset-loader-unavailable',{fallback:'prism'});
  await initBabylonAssetLibrary();
}
const qs=o=>new URLSearchParams({...o,format:'json',origin:'*'}).toString();
async function api(base,params,label='api',tries=3,timeout=9500){
  const t0=now();let last;
  for(let i=0;i<tries;i++){
    const ctl=new AbortController();const timer=setTimeout(()=>ctl.abort(),timeout+i*1200);
    try{
      const res=await fetch(base+'?'+qs(params),{mode:'cors',signal:ctl.signal});
      if(!res.ok)throw new Error('HTTP '+res.status);
      const text=await res.text();clearTimeout(timer);
      const ms=Math.round(now()-t0); if(ms>1800)WLOG('slow-fetch',{label,ms,bytes:text.length});
      return JSON.parse(text);
    }catch(e){clearTimeout(timer);last=e;if(i<tries-1)await sleep(350+i*500)}
  }
  WLOG('fetch-failed',{label,totalMs:Math.round(now()-t0),error:last?.message});throw last||new Error('fetch failed');
}
function labelOf(e){return e?.labels?.it?.value||e?.labels?.en?.value||e?.labels?.mul?.value||e?.id||'???'}
function descOf(e){return e?.descriptions?.it?.value||e?.descriptions?.en?.value||''}
function localizedFields(e){return {labels:{it:e?.labels?.it?.value||e?.labels?.en?.value||e?.labels?.mul?.value||e?.id||'???',en:e?.labels?.en?.value||e?.labels?.it?.value||e?.labels?.mul?.value||e?.id||'???'},descriptions:{it:e?.descriptions?.it?.value||e?.descriptions?.en?.value||'',en:e?.descriptions?.en?.value||e?.descriptions?.it?.value||''}}}
function imageName(e){return e?.claims?.P18?.[0]?.mainsnak?.datavalue?.value||null}

function hasUsefulLabel(e){
  const lf=localizedFields(e);
  const vals=[lf.labels.it,lf.labels.en].filter(Boolean);
  return vals.some(v=>!/^Q\d+$/i.test(String(v).trim()));
}
function linkedQids(e){const out=[],seen=new Set();for(const cs of Object.values(e?.claims||{}))for(const st of cs||[]){const v=st?.mainsnak?.datavalue?.value;if(v&&typeof v==='object'&&v['entity-type']==='item'&&v.id&&!seen.has(v.id)){seen.add(v.id);out.push(v.id)}}return out}
async function getEntities(ids){
  const out={};
  for(let i=0;i<ids.length;i+=6){const chunk=ids.slice(i,i+6);try{const d=await api(WD,{action:'wbgetentities',ids:chunk.join('|'),props:'labels|descriptions|claims',languages:'it|en|mul'},'wikidata:wbgetentities');Object.assign(out,d.entities||{})}catch(e){if(chunk.length>1){for(const id of chunk){try{const d=await api(WD,{action:'wbgetentities',ids:id,props:'labels|descriptions|claims',languages:'it|en|mul'},'wikidata:item',2,7000);Object.assign(out,d.entities||{})}catch(_){WLOG('wikidata-item-skipped',{id})}}}}}
  return out;
}
async function commonsUrls(files,width=900){const map=new Map();const u=[...new Set(files.filter(Boolean))];for(let i=0;i<u.length;i+=18){const c=u.slice(i,i+18);const d=await api(CM,{action:'query',titles:c.map(x=>'File:'+x).join('|'),prop:'imageinfo',iiprop:'url',iiurlwidth:width},'commons:imageinfo');for(const p of Object.values(d.query?.pages||{})){const fn=(p.title||'').replace(/^File:/,'');const inf=p.imageinfo?.[0];if(inf)map.set(fn,inf.thumburl||inf.url)}}return map}
async function randomBaseEntity(){for(let a=0;a<7;a++){const d=await api(WD,{action:'query',list:'random',rnnamespace:0,rnlimit:10},'wikidata:random');const ids=(d.query?.random||[]).map(x=>x.title).filter(x=>/^Q\d+$/.test(x));const es=await getEntities(ids);const hits=ids.map(id=>es[id]).filter(e=>e&&imageName(e)&&hasUsefulLabel(e));if(!hits.length)continue;const e=pick(hits);const urls=await commonsUrls([imageName(e)],1100);const image=urls.get(imageName(e));if(image){const lf=localizedFields(e);return {qid:e.id,label:lf.labels.it,description:lf.descriptions.it,labels:lf.labels,descriptions:lf.descriptions,image}}}
 throw new Error('no random entity')}
async function searchBaseEntity(term){const s=await api(WD,{action:'wbsearchentities',search:term,language:'it',uselang:'it',type:'item',limit:10},'wikidata:search');const ids=(s.search||[]).map(x=>x.id);const es=await getEntities(ids);const e=ids.map(id=>es[id]).find(x=>x&&imageName(x)&&hasUsefulLabel(x));if(!e)throw new Error('no image');const urls=await commonsUrls([imageName(e)],1100);const image=urls.get(imageName(e));if(!image)throw new Error('no image');const lf=localizedFields(e);return {qid:e.id,label:lf.labels.it,description:lf.descriptions.it,labels:lf.labels,descriptions:lf.descriptions,image}}

// ---------- image pipeline ----------
function sourceImage(url){if(imageCache.has(url))return imageCache.get(url);const p=new Promise((resolve,reject)=>{const im=new Image();im.crossOrigin='anonymous';im.decoding='async';im.onload=()=>resolve(im);im.onerror=reject;im.src=url});imageCache.set(url,p);return p}
function cover(ctx,img,w,h,rot=0,scale=1){const ir=img.width/img.height,tr=w/h;let dw,dh;if(ir>tr){dh=h*scale;dw=dh*ir}else{dw=w*scale;dh=dw/ir}ctx.save();ctx.translate(w/2,h/2);ctx.rotate(rot);ctx.drawImage(img,-dw/2,-dh/2,dw,dh);ctx.restore()}
function cleanTexture(name,url,size=MOBILE?384:512){const dt=new BABYLON.DynamicTexture(name,{width:size,height:size},scene,true,BABYLON.Texture.TRILINEAR_SAMPLINGMODE);const c=dt.getContext();c.fillStyle='#111';c.fillRect(0,0,size,size);dt.update(false);sourceImage(url).then(im=>{c.clearRect(0,0,size,size);cover(c,im,size,size,0,1.02);dt.update(false)}).catch(()=>{});return dt}
function distortedTexture(name,url,size=MOBILE?192:256){const dt=new BABYLON.DynamicTexture(name,{width:size,height:size},scene,true,BABYLON.Texture.BILINEAR_SAMPLINGMODE);const c=dt.getContext();c.fillStyle='#222';c.fillRect(0,0,size,size);dt.update(false);sourceImage(url).then(im=>{const tmp=document.createElement('canvas');tmp.width=tmp.height=size;const tc=tmp.getContext('2d',{willReadFrequently:true});tc.fillStyle='#000';tc.fillRect(0,0,size,size);cover(tc,im,size,size,rnd(Math.PI*2),1.05+rnd(.7));const src=tc.getImageData(0,0,size,size),out=c.createImageData(size,size),s=src.data,d=out.data;const levels=3+Math.floor(rnd(5)),sat=.5+rnd(2.3),shift=2+Math.floor(rnd(8)),invert=Math.random()>.5;for(let y=0;y<size;y++)for(let x=0;x<size;x++){const i=(y*size+x)*4;const xr=Math.min(size-1,Math.max(0,x+shift)),xb=Math.min(size-1,Math.max(0,x-shift));let r=s[(y*size+xr)*4],g=s[i+1],b=s[(y*size+xb)*4+2];const gray=(r+g+b)/3;r=gray+(r-gray)*sat;g=gray+(g-gray)*sat;b=gray+(b-gray)*sat;const q=255/(levels-1);r=Math.round(r/q)*q;g=Math.round(g/q)*q;b=Math.round(b/q)*q;if(invert&&Math.sin(x*.08+y*.04+rnd(4))>.72){r=255-r;b=255-b}d[i]=r;d[i+1]=g;d[i+2]=b;d[i+3]=255}c.putImageData(out,0,0);dt.update(false)}).catch(()=>{});dt.wrapU=dt.wrapV=BABYLON.Texture.WRAP_ADDRESSMODE;dt.uScale=1+rnd(3);dt.vScale=1+rnd(3);return dt}
function matColor(name,color,em=.05){const m=new BABYLON.StandardMaterial(name,scene);m.diffuseColor=color;m.emissiveColor=color.scale(em);m.specularColor=BABYLON.Color3.Black();return m}
function matSurface(name,url,tint,em=.08){const m=new BABYLON.StandardMaterial(name,scene);const t=distortedTexture(name+'_t',url);m.diffuseTexture=t;m.emissiveTexture=t;m.diffuseColor=tint;m.emissiveColor=tint.scale(em);m.ambientColor=tint.scale(.22);m.specularColor=BABYLON.Color3.Black();return m}
function matDist(name,url,em=.25){const m=new BABYLON.StandardMaterial(name,scene);const t=distortedTexture(name+'_t',url);m.diffuseTexture=t;m.emissiveTexture=t;m.emissiveColor=new BABYLON.Color3(em,em,em);m.specularColor=BABYLON.Color3.Black();return m}
function matClean(name,url,em=1){const m=new BABYLON.StandardMaterial(name,scene);const t=cleanTexture(name+'_t',url);m.diffuseTexture=t;m.emissiveTexture=t;m.emissiveColor=new BABYLON.Color3(em,em,em);m.diffuseColor=new BABYLON.Color3(1,1,1);m.specularColor=BABYLON.Color3.Black();m.disableLighting=true;return m}

// ---------- engine ----------
function init3d(){
  engine=new BABYLON.Engine(canvas,true,{preserveDrawingBuffer:false,stencil:false,adaptToDeviceRatio:true});engine.setHardwareScalingLevel(MOBILE?1.25:1);
  scene=new BABYLON.Scene(engine);scene.clearColor=new BABYLON.Color4(0,0,0,1);scene.fogMode=BABYLON.Scene.FOGMODE_EXP2;scene.fogDensity=.008;scene.fogColor=new BABYLON.Color3(.06,.06,.07);
  camera=new BABYLON.UniversalCamera('cam',new BABYLON.Vector3(0,1.72,0),scene);camera.fov=1.0;camera.minZ=.05;camera.maxZ=450;
  const hemi=new BABYLON.HemisphericLight('hemi',new BABYLON.Vector3(.2,1,.1),scene);hemi.intensity=.78;
  const sun=new BABYLON.DirectionalLight('sun',new BABYLON.Vector3(-.35,-1,.2),scene);sun.intensity=.34;
  addInput();
  let frames=0,last=now(),lastTexCheck=now();
  engine.runRenderLoop(()=>{updateMovement();updateAnimators();updateInfiniteWorld();if(frames%180===0)ensureEntityPopulation('periodic');checkLinks();scene.render();frames++;const n=now();if(n-last>5000){WLOG('fps',{fps:Math.round(frames*1000/(n-last)),meshes:scene.meshes.length,materials:scene.materials.length,textures:scene.textures.length});frames=0;last=n}if(n-lastTexCheck>9000){const bad=scene.materials.filter(m=>m.diffuseTexture&&m.diffuseTexture.isReady&&!m.diffuseTexture.isReady()).map(m=>m.name).slice(0,12);if(bad.length)WLOG('texture-not-ready',{materials:bad});lastTexCheck=n}});
  window.addEventListener('resize',()=>engine.resize());
}
function clearDream(){
  streamToken++;if(voiceTimer)clearTimeout(voiceTimer);voiceTimer=null;stopMusic();if('speechSynthesis'in window)speechSynthesis.cancel();
  colliders=[];entities=[];animators=[];spawnSlots=[];searchOrb=null;lastChunkKey='';
  linkPool=[];linkPoolIds.clear();entityPopulateBusy=false;
  for(const ch of infiniteChunks.values())try{ch.root.dispose(false,false)}catch(e){} infiniteChunks.clear();
  if(envRoot)envRoot.dispose(false,true);if(entityRoot)entityRoot.dispose(false,true);if(skyMesh)skyMesh.dispose(false,true);
  envRoot=new BABYLON.TransformNode('env',scene);entityRoot=new BABYLON.TransformNode('entities',scene)
}

// ---------- helpers / collision ----------
function addRect(x,z,w,d,tag=null){colliders.push({t:'r',x,z,w,d,tag})}function addCircle(x,z,r,tag=null){colliders.push({t:'c',x,z,r,tag})}
function blocked(x,z){for(const c of colliders){if(c.t==='r'&&Math.abs(x-c.x)<c.w*.5+.48&&Math.abs(z-c.z)<c.d*.5+.48)return true;if(c.t==='c'){const dx=x-c.x,dz=z-c.z;if(dx*dx+dz*dz<(c.r+.48)**2)return true}}return false}
function box(name,x,y,z,w,h,d,mat,collide=true){const m=BABYLON.MeshBuilder.CreateBox(name,{width:w,height:h,depth:d},scene);m.position.set(x,y+h/2,z);m.material=mat;m.parent=envRoot;if(collide)addRect(x,z,w,d);return m}
function cyl(name,x,y,z,diam,h,sides,mat,collide=true){const m=BABYLON.MeshBuilder.CreateCylinder(name,{diameter:diam,height:h,tessellation:sides},scene);m.position.set(x,y+h/2,z);m.material=mat;m.parent=envRoot;if(collide)addCircle(x,z,diam*.45);return m}
function addSpawn(x,z,yaw=0,tag='core'){spawnSlots.push({x,z,yaw,used:false,tag})}
function terrainMesh(name,size,sub,heightFn,mat){const m=BABYLON.MeshBuilder.CreateGround(name,{width:size,height:size,subdivisions:sub,updatable:true},scene);const p=m.getVerticesData(BABYLON.VertexBuffer.PositionKind);for(let i=0;i<p.length;i+=3)p[i+1]=heightFn(p[i],p[i+2]);m.updateVerticesData(BABYLON.VertexBuffer.PositionKind,p);BABYLON.VertexData.ComputeNormals(p,m.getIndices(),m.getVerticesData(BABYLON.VertexBuffer.NormalKind));m.refreshBoundingInfo();m.material=mat;m.parent=envRoot;return m}
function groundY(x,z){return groundHeight?groundHeight(x,z):0}
function addSky(url){skyMesh=BABYLON.MeshBuilder.CreateSphere('sky',{diameter:420,segments:20,sideOrientation:BABYLON.Mesh.BACKSIDE},scene);skyMesh.infiniteDistance=true;skyMesh.applyFog=false;skyMesh.isPickable=false;const m=matClean('skyMat',url,1);m.backFaceCulling=false;m.disableDepthWrite=true;skyMesh.material=m}
function clearAt(x,z,r=3.5){
  const pts=[[0,0],[r,0],[-r,0],[0,r],[0,-r],[r*.7,r*.7],[-r*.7,r*.7],[r*.7,-r*.7],[-r*.7,-r*.7]];
  return pts.every(([dx,dz])=>!blocked(x+dx,z+dz));
}
function nearSearchOrb(x,z,r=10){

function updateMovement(){
  if(!camera||transitioning||searchEl.style.display==='flex')return;const dt=Math.min(.04,engine.getDeltaTime()/1000);let f=(keys.f?1:0)-(keys.b?1:0),s=(keys.r?1:0)-(keys.l?1:0);if(joystick.active){f+=-joystick.y;s+=joystick.x}f=Math.max(-1,Math.min(1,f));s=Math.max(-1,Math.min(1,s));const moving=Math.abs(f)>.03||Math.abs(s)>.03;
  if(moving){let fw=camera.getDirection(BABYLON.Axis.Z);fw.y=0;fw.normalize();let rt=camera.getDirection(BABYLON.Axis.X);rt.y=0;rt.normalize();const v=fw.scale(f).add(rt.scale(s));if(v.lengthSquared()){v.normalize().scaleInPlace((MOBILE?5.3:6.8)*dt);const ox=camera.position.x,oz=camera.position.z,nx=ox+v.x,nz=oz+v.z;if(!blocked(nx,oz))camera.position.x=nx;if(!blocked(camera.position.x,nz))camera.position.z=nz;if(camera.position.x===ox&&camera.position.z===oz){const sx=v.z*.6,sz=-v.x*.6;if(!blocked(ox+sx,oz+sz)){camera.position.x+=sx;camera.position.z+=sz}}}movingTime+=dt}else movingTime=0;
  const bob=moving?Math.sin(movingTime*11)*.055:0;const target=groundY(camera.position.x,camera.position.z)+1.72+bob;camera.position.y+= (target-camera.position.y)*Math.min(1,dt*10);
}
function updateAnimators(){const t=now()*.001;for(const a of animators){if(a.t==='object'){a.root.position.y=groundY(a.root.position.x,a.root.position.z);a.root.rotation.y+=.003}else if(a.t==='orb'){a.root.position.y=a.baseY+Math.sin(t*2+a.phase)*.22}}
  // occasional visual world stretch, subtle and non-deterministic
  if(envRoot){const k=1+Math.sin(t*.17)*.003+Math.sin(t*.071)*.002;envRoot.scaling.x=k;envRoot.scaling.z=2-k}
}
function checkLinks(){if(transitioning||searchEl.style.display==='flex')return;const x=camera.position.x,z=camera.position.z;if(searchOrb&&now()>searchCooldown){const p=searchOrb.getAbsolutePosition(),dx=x-p.x,dz=z-p.z;if(dx*dx+dz*dz<3.5){openSearch();return}}
  for(const root of entities){if(root.isDisposed())continue;const p=root.getAbsolutePosition(),dx=x-p.x,dz=z-p.z;if(dx*dx+dz*dz<5.4){enterEntity(root.metadata);return}}
}
async function enterEntity(info){if(transitioning)return;transitioning=true;const t0=now();WLOG('transition-start',{from:currentEntity?.qid,to:info.qid});showLoading(true);await sleep(80+rnd(140));buildDream(info);showLoading(false);transitioning=false;WLOG('transition-end',{to:info.qid,world:currentWorld,ms:Math.round(now()-t0)})}

// ---------- input ----------
function addInput(){
  const joy=$('joystick'),knob=$('joystickKnob');
  const setJoy=(e)=>{
    const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const max=r.width*.34,len=Math.hypot(dx,dy);if(len>max){dx=dx/len*max;dy=dy/len*max}joystick.x=dx/max;joystick.y=dy/max;knob.style.transform=`translate(${dx}px,${dy}px)`;
  };
  const joyEnd=(e)=>{if(joystick.pid!==null&&e.pointerId!==joystick.pid)return;joystick.active=false;joystick.pid=null;joystick.x=joystick.y=0;knob.style.transform='translate(0px,0px)';};
  joy.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();resumeAudio();joystick.active=true;joystick.pid=e.pointerId;joy.setPointerCapture?.(e.pointerId);setJoy(e)});
  joy.addEventListener('pointermove',e=>{if(!joystick.active||e.pointerId!==joystick.pid)return;e.preventDefault();e.stopPropagation();setJoy(e)});
  joy.addEventListener('pointerup',e=>{e.preventDefault();e.stopPropagation();joyEnd(e)});
  joy.addEventListener('pointercancel',joyEnd);
  const map={KeyW:'f',ArrowUp:'f',KeyS:'b',ArrowDown:'b',KeyA:'l',ArrowLeft:'l',KeyD:'r',ArrowRight:'r'};window.addEventListener('keydown',e=>{if(e.code==='KeyM'){setSilent(!silentMode);return}if(e.code==='KeyL'){cycleLanguage();return}if(searchEl.style.display==='flex')return;const k=map[e.code];if(k){e.preventDefault();keys[k]=true;resumeAudio()}},{passive:false});window.addEventListener('keyup',e=>{const k=map[e.code];if(k){e.preventDefault();keys[k]=false}},{passive:false});window.addEventListener('blur',()=>{keys.f=keys.b=keys.l=keys.r=false;joystick.active=false;joystick.x=joystick.y=0;const k=$('joystickKnob');if(k)k.style.transform='translate(0px,0px)'});
  let active=false,pid,lastX,lastY;canvas.addEventListener('pointerdown',e=>{resumeAudio();active=true;pid=e.pointerId;lastX=e.clientX;lastY=e.clientY;canvas.setPointerCapture?.(pid)});canvas.addEventListener('pointermove',e=>{if(!active||e.pointerId!==pid||searchEl.style.display==='flex')return;const dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;camera.rotation.y+=dx*.0052;camera.rotation.x=Math.max(-1.15,Math.min(1.15,camera.rotation.x+dy*.0043))});const end=e=>{if(e.pointerId===pid)active=false};canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end)
}
function openSearch(){if(searchEl.style.display==='flex')return;searchEl.style.display='flex';searchInput.value='';setTimeout(()=>searchInput.focus(),30)}
function closeSearch(){searchEl.style.display='none';searchCooldown=now()+1400}
$('searchClose').addEventListener('click',closeSearch);$('searchForm').addEventListener('submit',async e=>{e.preventDefault();const q=searchInput.value.trim();if(!q)return;closeSearch();showLoading(true);try{const base=await searchBaseEntity(q);await enterEntity(base)}catch(err){WLOG('search-error',{error:err.message})}finally{showLoading(false)}});

$('muteBtn').addEventListener('click',()=>{resumeAudio();setSilent(!silentMode)});
$('langBtn').addEventListener('click',()=>{resumeAudio();cycleLanguage()});

// ---------- audio ----------
function ensureAudio(){if(audioCtx)return;audioCtx=new (window.AudioContext||window.webkitAudioContext)();audioMaster=audioCtx.createGain();audioMaster.gain.value=.16;audioMaster.connect(audioCtx.destination)}
async function resumeAudio(){try{ensureAudio();if(audioCtx.state!=='running')await audioCtx.resume();if(currentEntity&&!silentMode&&!voiceTimer)speakLoop(entityLabel())}catch(e){}}
function stopMusic(){for(const n of audioNodes){try{n.stop?.()}catch(e){}try{n.disconnect?.()}catch(e){}}audioNodes=[]}
function startAudioForWorld(){stopMusic();if(!audioCtx||audioCtx.state!=='running'){speakLoop(entityLabel());return}const master=audioCtx.createGain();master.gain.value=.18;master.connect(audioMaster);audioNodes.push(master);const count=1+Math.floor(rnd(4));for(let i=0;i<count;i++){const o=audioCtx.createOscillator(),g=audioCtx.createGain(),l=audioCtx.createOscillator(),lg=audioCtx.createGain();o.type=pick(['sine','triangle','sawtooth']);o.frequency.value=pick([43,55,66,82,110,147,196,220,294])*(.75+rnd(.9));g.gain.value=.008+rnd(.023);l.frequency.value=.03+rnd(.35);lg.gain.value=.004+rnd(.015);l.connect(lg);lg.connect(g.gain);o.connect(g);g.connect(master);o.start();l.start();audioNodes.push(o,g,l,lg)}speakLoop(entityLabel())}
function speakLoop(name){
  if(voiceTimer)clearTimeout(voiceTimer);
  voiceTimer=null;
  if(silentMode||!('speechSynthesis'in window))return;
  speechSynthesis.cancel();
  const voices=speechSynthesis.getVoices();
  const chooseVoice=()=>{
    if(!voices.length)return null;
    const lang=currentTtsLang().slice(0,2).toLowerCase();
    const pref=voices.filter(v=>v.lang?.toLowerCase().startsWith(lang));
    return pick(pref.length?pref:voices);
  };
  const cleanDescription=()=>{
    let d=entityDescription().replace(/\s+/g,' ').trim();
    if(!d)return '';
    if(d.length>170)d=d.slice(0,167).replace(/\s+\S*$/,'')+'…';
    return d;
  };
  const go=()=>{
    if(silentMode||!currentEntity||entityLabel()!==name)return;
    const queue=[];
    const repetitions=1+Math.floor(rnd(2));
    for(let i=0;i<repetitions;i++){
      queue.push({text:name,rate:.42+rnd(.85),pitch:.08+rnd(1.5),volume:.38+rnd(.48),voice:chooseVoice()});
    }
    const description=cleanDescription();
    if(description && Math.random()<.72){
      queue.push({text:description,rate:.55+rnd(.55),pitch:.12+rnd(.95),volume:.28+rnd(.42),voice:chooseVoice()});
    }
    queue.forEach((item,i)=>{
      const u=new SpeechSynthesisUtterance(item.text);
      u.lang=currentTtsLang();u.rate=item.rate;u.pitch=item.pitch;u.volume=item.volume;
      if(item.voice)u.voice=item.voice;
      if(i===queue.length-1){
        u.onend=()=>voiceTimer=setTimeout(go,700+rnd(3300));
        u.onerror=()=>voiceTimer=setTimeout(go,1600);
      }
      speechSynthesis.speak(u);
    });
    WLOG('tts-cycle',{label:name,description:!!description&&queue.length>repetitions,utterances:queue.length,lang:currentTtsLang()});
  };
  go();
}

// ---------- boot ----------
async function boot(){const t0=now();WLOG('app-start',{name:APP_NAME,version:APP_VERSION,href:location.href});try{await ensureBabylon();init3d();if(!('speechSynthesis' in window))setSilent(true);const base=await randomBaseEntity();currentEntity=base;buildDream(base);showLoading(false);WLOG('boot-ready',{qid:base.qid,world:currentWorld,ms:Math.round(now()-t0)})}catch(err){WLOG('boot-error',{error:err.message});await sleep(1200);boot()}}
boot();
})();
</script>
